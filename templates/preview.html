<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview QSL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container my-4">
    <h3>Preview QSL Card</h3>

    <img src="{{ card_path }}" class="img-fluid border mb-3" alt="QSL Card">

    <p>
        <strong>Email:</strong>
        {% if email %}
            {{ email }}
        {% else %}
            <span class="text-danger">No email found</span>
        {% endif %}
    </p>

    <form method="post" action="{{ url_for('send_qsl') }}">
        <!-- Preserve QSL form data -->
        {% for key, value in form_data.items() %}
            <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
        <input type="hidden" name="card_path" value="{{ card_path }}">
        <input type="hidden" name="email" value="{{ email or '' }}">

        <!-- Action checkboxes -->
        <div class="form-check mb-2">
            <input
                class="form-check-input"
                type="checkbox"
                id="send_qsl"
                name="send_qsl"
                value="yes"
                {% if email %}checked{% else %}disabled{% endif %}
            >
            <label class="form-check-label" for="send_qsl">
                Send QSL Card
                {% if not email %}
                    <span class="text-muted">(no email available)</span>
                {% endif %}
            </label>
        </div>

        <div class="form-check mb-3">
            <input
                class="form-check-input"
                type="checkbox"
                id="log_qso"
                name="log_qso"
                value="yes"
                checked
            >
            <label class="form-check-label" for="log_qso">
                Log QSO to QRZ
            </label>
        </div>

        <button
            type="submit"
            class="btn btn-success"
            {% if not email %} {% endif %}
        >
            Confirm
        </button>
    </form>
</div>
</body>
</html>
