<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview QSL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h3>Preview QSL Card</h3>
    <img src="{{ card_path }}" class="img-fluid border" alt="QSL Card">

    <p>Email to: {{ email or "No email found" }}</p>

    {% if email %}
    <form method="post" action="{{ url_for('send_qsl') }}">
        <!-- send needed info -->
        {% for key, value in form_data.items() %}
            <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
        <input type="hidden" name="email" value="{{ email }}">
        <button type="submit" class="btn btn-success mt-3">Send QSL</button>
    </form>
    {% else %}
        <p class="text-danger">Cannot send: no email available.</p>
    {% endif %}
</div>
</body>
</html>
