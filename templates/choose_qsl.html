<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose QSL Card</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .backdrop-option {
            cursor: pointer;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 4px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: #fff;
        }
        
        .backdrop-option:hover {
            border-color: #adb5bd;
        }
        
        input[type="radio"]:checked + .backdrop-option {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
        }
        .qso-summary {
            font-family: "JetBrainsMono Nerd Font", monospace;
            font-size: 0.95rem;
        }
    </style>
</head>
<body class="container py-4">

    <h2 class="mb-3">Choose QSL Card</h2>
    <!-- QSO Summary -->
    <div class="alert alert-secondary qso-summary mb-4">
        <strong>With: {{ qso.With }}</strong><br>
        <strong>Date: {{ qso.Date }}</strong><br>
        <strong>Band: {{ qso.Band }}</strong><br>
        <strong>Mode: {{ qso.Mode }}</strong><br>
        <strong>Freq: {{ qso.Freq }}</strong><br>
        <strong>RSTS: {{ qso.RSTS }}</strong><br>
        <strong>RSTR: {{ qso.RSTR }}</strong><br>
    </div>

    <form method="post" action="{{ url_for('confirm_qsl') }}">

        <!-- Preserve QSO data -->
        {% for k, v in qso.items() %}
            <input type="hidden" name="{{ k }}" value="{{ v }}">
        {% endfor %}

        <h5 class="mb-3">Select a card background</h5>

        <div class="row g-3">
            {% for img in backdrops %}
            <div class="col-6 col-md-4 col-lg-3">
                <label class="w-100">
                    <input
                        type="radio"
                        name="__hidden_backdrop"
                        value="{{ img }}"
                        class="d-none backdrop-radio"
                        id="backdrop-{{ loop.index0 }}"
                    >
                    <div class="backdrop-option text-center">
                        <img
                            src="{{ url_for('static', filename='img/backdrops/' ~ img) }}"
                            alt="{{ img }}"
                            class="img-fluid"
                            style="max-height: 140px; object-fit: cover;"
                        >
                    </div>
                </label>
            </div>
            {% endfor %}
        </div>
        <!-- No card option -->
        <div class="form-check mt-2">
            <input
                class="form-check-input"
                type="radio"
                name="__hidden_backdrop"
                value="none"
                id="noCard"
                checked
            >
            <label class="form-check-label" for="noCard">
                Do not generate a QSL card
            </label>
        </div>

        <hr class="my-4">
        <h5>Actions</h5>
        
        <!-- Email input -->
        <div class="mb-3" style="max-width: 30%;">
            <label for="emailInput" class="form-label">Email to send QSL card</label>
            <input 
                type="email"
                class="form-control"
                id="emailInput"
                name="__hidden_email"
                placeholder="Enter email..."
                value="{{ qso.__hidden_email or '' }}"
            >
        </div>
        
        <div class="form-check mb-3">
            <input
                class="form-check-input"
                type="checkbox"
                name="__hidden_send_qsl"
                value="yes"
                id="sendQsl"
            >
            <label class="form-check-label" for="sendQsl">
                Send QSL card
            </label>
        </div>
        <div class="form-check">
            <input
                class="form-check-input"
                type="checkbox"
                name="__hidden_log_qso"
                value="yes"
                id="logQso"
                checked
            >
            <label class="form-check-label" for="logQso">
                Log QSO to QRZ
            </label>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                Continue
            </button>
            <a
                href="{{ url_for('lookup', callsign=qso.With) }}"
                class="btn btn-secondary ms-2"
            >
                Cancel
            </a>
        </div>

    </form>

</body>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const emailInput = document.getElementById("emailInput");
    const sendQsl = document.getElementById("sendQsl");
    const noCard = document.getElementById("noCard");
    const backdropRadios = document.querySelectorAll(".backdrop-radio");

    const firstImage = backdropRadios.length ? backdropRadios[0] : null;

    function hasEmail() {
        return emailInput.value.trim().length > 0;
    }

    function isImageSelected() {
        return [...backdropRadios].some(r => r.checked);
    }

    function applyRules() {
        if (!hasEmail()) {
            // NO EMAIL CASE
            noCard.checked = true;
            sendQsl.checked = false;
            sendQsl.disabled = true;
            return;
        }

        if (noCard.checked) {
            // Email exists, but no card selected
            sendQsl.checked = false;
            sendQsl.disabled = true;
            return;
        }

        // Email exists + card selected
        sendQsl.disabled = false;
        sendQsl.checked = true;
    }

    // --- Event wiring ---

    // When user types email
    emailInput.addEventListener("input", () => {
        if (hasEmail() && !isImageSelected() && firstImage) {
            firstImage.checked = true;
        }
        applyRules();
    });

    // When selecting "no card"
    noCard.addEventListener("change", applyRules);

    // When selecting any card image
    backdropRadios.forEach(radio =>
        radio.addEventListener("change", () => {
            if (radio.checked) {
                noCard.checked = false;
            }
            applyRules();
        })
    );

    // --- Initial state on page load ---
    if (hasEmail()) {
        if (firstImage) firstImage.checked = true;
    } else {
        noCard.checked = true;
    }

    applyRules();
});
</script>
</html>
