<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyQSL Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }

        [data-bs-theme="dark"] .backdrop-option {
            background-color: #1a1a1a;
            border-color: #2a2a2a;
        }

        [data-bs-theme="dark"] .alert-secondary {
            background-color: #1f1f1f;
            border-color: #2a2a2a;
        }
        .search-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        input[type="text"] {
            font-size: 2rem;
            padding: 0.5rem 1rem;
        }
    </style>
</head>
<body class="container py-4" data-bs-theme="auto">
    <div class="d-flex justify-content-end mb-3">
        <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            id="themeToggle"
            aria-label="Toggle dark mode"
        >
            🌙 Dark
        </button>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <div class="search-container">
        <form method="post" class="w-50">
            <div class="input-group">
                <input type="text" name="callsign" class="form-control" placeholder="Enter callsign..." required>
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
        </form>
    </div>
</body>
<script>
    (function () {
        const toggleBtn = document.getElementById("themeToggle");
        const body = document.body;

        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {
            body.setAttribute("data-bs-theme", savedTheme);
        }

        function updateLabel() {
            const theme = body.getAttribute("data-bs-theme");
            toggleBtn.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
        }

        toggleBtn.addEventListener("click", () => {
            const current = body.getAttribute("data-bs-theme");
            const next = current === "dark" ? "light" : "dark";
            body.setAttribute("data-bs-theme", next);
            localStorage.setItem("theme", next);
            updateLabel();
        });

        updateLabel();
    })();
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
          alert.classList.remove('show')
          alert.classList.add('fade')
        })
    }, 5000)
</script>
</html>
