{% extends "base.html" %}

{% block title %}
Chart Demo
{% endblock %}
{% block css %}
{% endblock %}
{% block bar %}
{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6" style="max-width:400px;">
            <canvas id="myChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}
{% block js %}
<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
<script>
const ctx = document.getElementById('myChart');

new Chart(ctx, {
  type: 'doughnut',
  data: {
    labels: ['Red', 'Blue', 'Yellow'],
    datasets: [{
      data: [30, 45, 25],
      backgroundColor: [
        '#dc3545', // Bootstrap danger
        '#0d6efd', // Bootstrap primary
        '#ffc107'  // Bootstrap warning
      ],
      borderWidth: 0
    }]
  },
  options: {
    cutout: '70%', // controls doughnut thickness
    responsive: true,
    plugins: {
      legend: {
        position: 'bottom'
      }
    }
  }
});
</script>
{% endblock %}
